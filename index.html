<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Henna Night - Swahili Edition</title>
  <meta name="description" content="Luxury Swahili Islamic Henna Night e-Invitation">
  <meta property="og:title" content="Rahma Riyadh Kisuo - Henna Night">
  <meta property="og:description" content="You are cordially invited to Rahma Riyadh Kisuo's Henna Night celebration.">
  <meta property="og:image" content="https://prsvas.github.io/Rahma-Riyad-Henna-Function/assets/social-preview.jpg">
  <meta property="og:url" content="https://prsvas.github.io/Rahma-Riyad-Henna-Function/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rahma Riyadh Kisuo - Henna Night">
  <meta name="twitter:description" content="You are cordially invited to Rahma Riyadh Kisuo's Henna Night celebration.">
  <meta name="twitter:image" content="https://prsvas.github.io/Rahma-Riyad-Henna-Function/assets/social-preview.jpg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  <meta name="theme-color" content="#061c66">
  <style>
    :root {
      --blue: #061c66;
      --gold: #d8a13d;
      --gold-soft: #ffe3a0;
      --ink: #fdf7e8;
      --panel: rgba(4, 13, 42, 0.88);
      --shadow: 0 24px 90px rgba(0, 0, 0, 0.42);
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #02040d;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 215, 128, 0.18), transparent 26rem),
        radial-gradient(circle at 80% 5%, rgba(55, 106, 255, 0.18), transparent 24rem),
        linear-gradient(160deg, #01030a, #071340 48%, #02040d);
      color: var(--ink);
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .app {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 214, 129, 0.25), transparent 20rem),
        radial-gradient(circle at 40% 80%, rgba(21, 55, 159, 0.32), transparent 18rem),
        #03040a;
      transition: opacity 900ms ease, transform 900ms ease, visibility 900ms ease;
    }

    .splash.is-hidden {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      position: relative;
      width: min(92vw, 520px);
      min-height: 520px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 42px 28px;
      overflow: hidden;
      border: 1px solid rgba(255, 220, 141, 0.45);
      border-radius: 28px;
      box-shadow: var(--shadow), inset 0 0 40px rgba(255, 206, 108, 0.09);
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 229, 171, 0.24), transparent 12rem),
        linear-gradient(160deg, rgba(8, 23, 70, 0.96), rgba(1, 5, 20, 0.96));
    }

    .splash-card::before,
    .splash-card::after,
    .viewport::after,
    .slide::after {
      content: "";
      position: absolute;
      inset: -45%;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 42%, rgba(255, 246, 206, 0.36) 49%, transparent 56%);
      transform: translateX(-75%) rotate(5deg);
      animation: sweep 7s ease-in-out infinite;
    }

    .splash-card::after {
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255, 239, 184, 0.92) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(255, 255, 255, 0.65) 0 1px, transparent 2px);
      background-size: 58px 58px, 91px 91px;
      animation: glitter 5s linear infinite;
      opacity: 0.34;
    }

    .splash-content {
      position: relative;
      z-index: 2;
    }

    .lantern {
      width: 92px;
      height: 130px;
      margin: 0 auto 24px;
      border: 2px solid rgba(255, 220, 141, 0.72);
      border-radius: 44px 44px 22px 22px;
      background:
        radial-gradient(circle, rgba(255, 223, 126, 0.95), rgba(215, 120, 28, 0.32) 45%, transparent 68%),
        linear-gradient(90deg, transparent 28%, rgba(255, 224, 148, 0.28) 50%, transparent 72%);
      box-shadow: 0 0 46px rgba(255, 184, 74, 0.52);
      animation: lanternPulse 3s ease-in-out infinite;
    }

    .splash h1 {
      margin: 0;
      color: var(--gold-soft);
      font-size: clamp(2.5rem, 11vw, 4.9rem);
      font-weight: 500;
      letter-spacing: 0;
      text-shadow: 0 0 28px rgba(255, 204, 99, 0.45);
    }

    .splash p {
      margin: 12px 0 34px;
      color: #fff4d3;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
    }

    .open-button,
    .panel button {
      min-height: 48px;
      padding: 12px 22px;
      border-radius: 999px;
      color: #091031;
      background: linear-gradient(135deg, #fff1ba, #d49a36 54%, #ffdf84);
      box-shadow: 0 12px 36px rgba(216, 161, 61, 0.36);
      font-weight: 700;
    }

    .viewport {
      position: relative;
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }

    .viewport::-webkit-scrollbar { display: none; }

    .slide {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      scroll-snap-align: start;
      overflow: hidden;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at var(--spark-x, 40%) var(--spark-y, 30%), rgba(255, 224, 138, 0.16), transparent 14rem),
        radial-gradient(circle at 75% 80%, rgba(38, 79, 206, 0.18), transparent 17rem);
      opacity: 0.82;
      pointer-events: none;
    }

    .slide-frame {
      position: relative;
      width: min(96vw, calc(94vh * var(--ratio)));
      max-height: 94vh;
      aspect-ratio: var(--ratio);
      border-radius: 18px;
      overflow: hidden;
      background: #06123c;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255, 217, 142, 0.28);
      animation: slideBreath 8s ease-in-out infinite;
    }

    .slide-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #06123c;
      user-select: none;
      -webkit-user-drag: none;
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .particle,
    .butterfly {
      position: absolute;
      left: var(--x);
      top: 105%;
      opacity: 0;
      animation: floatUp var(--d) linear infinite;
      animation-delay: var(--delay);
    }

    .particle {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffe6a5;
      box-shadow: 0 0 10px #ffd46c;
    }

    .butterfly {
      width: 20px;
      height: 16px;
      filter: drop-shadow(0 0 8px rgba(255, 212, 108, 0.8));
    }

    .butterfly::before,
    .butterfly::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 10px;
      height: 12px;
      border-radius: 10px 10px 4px 10px;
      background: linear-gradient(135deg, #fff2b8, #d99b2f);
      transform-origin: bottom center;
      animation: wing 650ms ease-in-out infinite alternate;
    }

    .butterfly::before { left: 1px; transform: rotate(-26deg); }
    .butterfly::after { right: 1px; transform: rotate(26deg) scaleX(-1); }

    .panel-toggle {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 25;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #f7d889;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(247, 216, 137, 0.5);
      backdrop-filter: blur(10px);
    }

    .panel {
      position: fixed;
      inset: auto 12px 70px auto;
      z-index: 30;
      width: min(420px, calc(100vw - 24px));
      max-height: calc(100vh - 92px);
      overflow: auto;
      padding: 18px;
      border: 1px solid rgba(255, 220, 141, 0.42);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      transform: translateY(18px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 250ms ease, transform 250ms ease, visibility 250ms ease;
    }

    .panel.is-open {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 640px) {
      .panel {
        inset: auto 10px 64px 10px;
        width: auto;
        max-height: 52vh;
        padding: 14px;
        border-radius: 14px;
      }

      .panel h2 {
        margin-bottom: 8px;
      }

      .field {
        margin-bottom: 8px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }

    .panel h2 {
      margin: 0 0 12px;
      color: var(--gold-soft);
      font-size: 1.35rem;
    }

    .field {
      display: grid;
      gap: 6px;
      margin: 12px 0;
    }

    .field label {
      color: #fff1c9;
      font-size: 0.92rem;
    }

    .field input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 220, 141, 0.38);
      border-radius: 10px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .pass-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      color: var(--blue);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
    }

    .pass-name,
    .pass-code,
    .pass-table,
    .pass-seat {
      position: absolute;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .pass-name {
      top: 56.3%;
      left: 50%;
      width: 68%;
      transform: translateX(-50%);
      font-size: clamp(0.5rem, 1.7vw, 0.86rem);
    }

    .pass-code {
      top: 64.3%;
      left: 50%;
      width: 68%;
      transform: translateX(-50%);
      font-size: clamp(0.5rem, 1.7vw, 0.86rem);
      letter-spacing: 0.04em;
      color: #071f7d;
    }

    .pass-table {
      top: 73.1%;
      left: 32.5%;
      width: 28%;
      transform: translateX(-50%);
      font-size: clamp(0.48rem, 1.6vw, 0.8rem);
      color: #071f7d;
    }

    .pass-seat {
      top: 73.1%;
      left: 67.5%;
      width: 28%;
      transform: translateX(-50%);
      font-size: clamp(0.48rem, 1.6vw, 0.8rem);
      line-height: 1.2;
      color: #071f7d;
    }

    .hint {
      margin: 10px 0 0;
      color: rgba(255, 244, 211, 0.82);
      font-size: 0.86rem;
      line-height: 1.45;
    }

    @keyframes sweep {
      0%, 45% { transform: translateX(-75%) rotate(5deg); opacity: 0; }
      56% { opacity: 1; }
      78%, 100% { transform: translateX(75%) rotate(5deg); opacity: 0; }
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-58px); }
    }

    @keyframes lanternPulse {
      0%, 100% { transform: translateY(0); box-shadow: 0 0 42px rgba(255, 184, 74, 0.44); }
      50% { transform: translateY(-5px); box-shadow: 0 0 62px rgba(255, 203, 103, 0.76); }
    }

    @keyframes slideBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.012); }
    }

    @keyframes floatUp {
      0% { transform: translate3d(0, 0, 0) scale(0.6); opacity: 0; }
      10%, 72% { opacity: 0.72; }
      100% { transform: translate3d(var(--drift), -118vh, 0) scale(1); opacity: 0; }
    }

    @keyframes wing {
      from { transform: rotate(-18deg) scaleY(0.92); }
      to { transform: rotate(24deg) scaleY(1.08); }
    }

    @media (max-width: 720px) {
      .slide {
        padding-inline: 8px;
      }

      .slide-frame {
        width: min(98vw, calc(92vh * var(--ratio)));
        border-radius: 12px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="splash" id="splash" aria-label="Opening screen">
      <div class="splash-card">
        <div class="splash-content">
          <div class="lantern" aria-hidden="true"></div>
          <h1>HENNA NIGHT</h1>
          <p>Swahili Edition</p>
          <button class="open-button" id="openInvitation" type="button">Tap to Open Invitation</button>
        </div>
      </div>
    </section>

    <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

    <section class="viewport" id="viewport" aria-label="Henna invitation slides">
      <article class="slide" data-slide="0">
        <div class="slide-frame" style="--ratio: 1672 / 941;">
          <img src="assets/slide01.webp" alt="Henna Night opening invitation" width="1672" height="941" loading="eager">
        </div>
      </article>

      <article class="slide" data-slide="1">
        <div class="slide-frame" style="--ratio: 811 / 2400;">
          <img src="assets/slide02.webp" alt="Henna Night invitation details" width="811" height="2400" loading="eager">
        </div>
      </article>

      <article class="slide" data-slide="2">
        <div class="slide-frame" style="--ratio: 852 / 2400;">
          <img src="assets/slide03.webp" alt="Henna Night programme" width="852" height="2400" loading="lazy">
        </div>
      </article>

      <article class="slide" data-slide="3">
        <div class="slide-frame" style="--ratio: 819 / 2400;">
          <img src="assets/slide04.webp" alt="Henna Night dress code" width="819" height="2400" loading="lazy">
        </div>
      </article>

      <article class="slide" data-slide="4">
        <div class="slide-frame" style="--ratio: 844 / 2400;">
          <img src="assets/slide05.webp" alt="Henna Night security pass" width="844" height="2400" loading="lazy">
          <div class="pass-overlay" aria-live="polite">
            <div class="pass-name" id="passGuestName"></div>
            <div class="pass-code" id="passCodeText"></div>
            <div class="pass-table" id="passTableText"></div>
            <div class="pass-seat" id="passSeatText"></div>
          </div>
        </div>
      </article>
    </section>

    <button class="panel-toggle" id="panelToggle" type="button" aria-label="Open sender panel">S</button>

    <aside class="panel" id="senderPanel" aria-label="Sender panel">
      <h2>Sender Panel</h2>
      <div class="field">
        <label for="guestName">Guest Name</label>
        <input id="guestName" autocomplete="name" placeholder="Guest full name">
      </div>
      <div class="field">
        <label for="mobileNumber">Mobile Number</label>
        <input id="mobileNumber" inputmode="tel" autocomplete="tel" placeholder="2557XXXXXXXX">
      </div>
      <div class="field">
        <label for="guestNumber">Guest Number</label>
        <input id="guestNumber" inputmode="numeric" placeholder="23">
      </div>
      <div class="field">
        <label for="tableNumber">Table Number</label>
        <input id="tableNumber" inputmode="numeric" placeholder="5">
      </div>
      <div class="field">
        <label for="seatNumber">Seat Number</label>
        <input id="seatNumber" inputmode="numeric" placeholder="2">
      </div>
      <div class="button-row">
        <button id="previewButton" type="button">Preview Invitation</button>
        <button id="sendButton" type="button">Send via WhatsApp</button>
      </div>
      <p class="hint">Pass Code is generated automatically, for example HN-00023. Table is shown separately, for example T-05. Open this panel with the S button or add <strong>?sender=1</strong> to the link.</p>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const AUTO_SCROLL_MS = 15000;
      const RESUME_IDLE_MS = 7000;
      const SLIDE_PATHS = [
        "assets/slide01.webp",
        "assets/slide02.webp",
        "assets/slide03.webp",
        "assets/slide04.webp",
        "assets/slide05.webp"
      ];

      const state = {
        currentSlide: 0,
        autoTimer: null,
        resumeTimer: null,
        hasOpened: false
      };

      const splash = document.getElementById("splash");
      const openInvitation = document.getElementById("openInvitation");
      const viewport = document.getElementById("viewport");
      const slides = Array.from(document.querySelectorAll(".slide"));
      const fxLayer = document.getElementById("fxLayer");
      const panelToggle = document.getElementById("panelToggle");
      const senderPanel = document.getElementById("senderPanel");

      const fields = {
        guestName: document.getElementById("guestName"),
        mobileNumber: document.getElementById("mobileNumber"),
        guestNumber: document.getElementById("guestNumber"),
        tableNumber: document.getElementById("tableNumber"),
        seatNumber: document.getElementById("seatNumber")
      };

      const output = {
        guestName: document.getElementById("passGuestName"),
        passCode: document.getElementById("passCodeText"),
        table: document.getElementById("passTableText"),
        seat: document.getElementById("passSeatText")
      };

      function preloadImages() {
        SLIDE_PATHS.forEach((path) => {
          const img = new Image();
          img.src = path;
        });
      }

      function pad(value, size) {
        const digits = String(value || "").replace(/\D/g, "");
        return digits.padStart(size, "0").slice(-size);
      }

      function getGuestData() {
        const guestNumber = pad(fields.guestNumber.value, 5);
        const tableNumber = pad(fields.tableNumber.value, 2);
        const seatNumber = pad(fields.seatNumber.value, 2);
        const passCode = `HN-${guestNumber}`;
        const tableCode = `T-${tableNumber}`;

        return {
          guestName: fields.guestName.value.trim(),
          mobileNumber: fields.mobileNumber.value.replace(/[^\d+]/g, ""),
          guestNumber,
          tableNumber,
          tableCode,
          seatNumber,
          passCode
        };
      }

      function updateSecurityPass() {
        const data = getGuestData();
        output.guestName.textContent = data.guestName || "";
        output.passCode.textContent = fields.guestNumber.value ? data.passCode : "";
        output.table.textContent = fields.tableNumber.value ? data.tableCode : "";
        output.seat.textContent = fields.seatNumber.value ? `S${data.seatNumber}` : "";
        return data;
      }

      function invitationUrl(data) {
        const url = new URL(window.location.href);
        url.searchParams.delete("sender");
        url.searchParams.delete("v");
        url.searchParams.set("guest", data.guestName);
        url.searchParams.set("gn", data.guestNumber);
        url.searchParams.set("table", data.tableNumber);
        url.searchParams.set("seat", data.seatNumber);
        url.searchParams.set("pass", data.passCode);
        return url.toString();
      }

      function populateFieldsFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const guest = params.get("guest") || "";
        const guestNumber = params.get("gn") || "";
        const tableNumber = params.get("table") || "";
        const seatNumber = params.get("seat") || "";

        if (guest) fields.guestName.value = guest;
        if (guestNumber) fields.guestNumber.value = guestNumber.replace(/\D/g, "");
        if (tableNumber) fields.tableNumber.value = tableNumber.replace(/\D/g, "");
        if (seatNumber) fields.seatNumber.value = seatNumber.replace(/\D/g, "");
      }

      function whatsappUrl(data) {
        const phone = data.mobileNumber.replace(/\D/g, "");
        const message = [
          "Assalamu Alaikum",
          "",
          `Dear ${data.guestName || "Guest"},`,
          "",
          "You are cordially invited to the Henna Night of Rahma Riyadh Kisuo.",
          "",
          "Your reserved seating:",
          "",
          `Table ${data.tableCode}`,
          `Seat S${data.seatNumber}`,
          "",
          "Pass Code:",
          "",
          data.passCode,
          "",
          "Kindly present your Security Pass at the venue entrance.",
          "",
          "We look forward to celebrating with you.",
          "",
          "Invitation Link:",
          "",
          invitationUrl(data)
        ].join("\n");

        return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      }

      function goToSlide(index) {
        const nextIndex = (index + slides.length) % slides.length;
        state.currentSlide = nextIndex;
        slides[nextIndex].scrollIntoView({ behavior: "smooth", block: "start" });
        triggerTransitionEffects();
      }

      function startAutoScroll() {
        clearInterval(state.autoTimer);
        state.autoTimer = setInterval(() => {
          goToSlide(state.currentSlide + 1);
        }, AUTO_SCROLL_MS);
      }

      function pauseAutoScroll() {
        clearInterval(state.autoTimer);
        clearTimeout(state.resumeTimer);
        if (!state.hasOpened) return;
        state.resumeTimer = setTimeout(startAutoScroll, RESUME_IDLE_MS);
      }

      function updateCurrentSlideFromScroll() {
        const viewportTop = viewport.scrollTop;
        const viewportHeight = viewport.clientHeight;
        state.currentSlide = Math.round(viewportTop / viewportHeight);
      }

      function triggerTransitionEffects() {
        document.documentElement.style.setProperty("--spark-x", `${35 + Math.random() * 35}%`);
        document.documentElement.style.setProperty("--spark-y", `${20 + Math.random() * 45}%`);
      }

      function createAmbientEffects() {
        const fragment = document.createDocumentFragment();

        for (let index = 0; index < 34; index += 1) {
          const particle = document.createElement("span");
          particle.className = "particle";
          particle.style.setProperty("--x", `${Math.random() * 100}%`);
          particle.style.setProperty("--d", `${9 + Math.random() * 9}s`);
          particle.style.setProperty("--delay", `${Math.random() * -12}s`);
          particle.style.setProperty("--drift", `${-40 + Math.random() * 80}px`);
          fragment.appendChild(particle);
        }

        for (let index = 0; index < 7; index += 1) {
          const butterfly = document.createElement("span");
          butterfly.className = "butterfly";
          butterfly.style.setProperty("--x", `${6 + Math.random() * 88}%`);
          butterfly.style.setProperty("--d", `${14 + Math.random() * 10}s`);
          butterfly.style.setProperty("--delay", `${Math.random() * -16}s`);
          butterfly.style.setProperty("--drift", `${-90 + Math.random() * 180}px`);
          fragment.appendChild(butterfly);
        }

        fxLayer.appendChild(fragment);
      }

      function openExperience() {
        state.hasOpened = true;
        splash.classList.add("is-hidden");
        setTimeout(() => goToSlide(0), 150);
        startAutoScroll();
      }

      function openSenderPanel() {
        senderPanel.classList.add("is-open");
      }

      function toggleSenderPanel() {
        senderPanel.classList.toggle("is-open");
      }

      Object.values(fields).forEach((field) => {
        field.addEventListener("input", updateSecurityPass);
      });

      document.getElementById("previewButton").addEventListener("click", () => {
        updateSecurityPass();
        senderPanel.classList.remove("is-open");
        openExperience();
        goToSlide(4);
      });

      document.getElementById("sendButton").addEventListener("click", () => {
        const data = updateSecurityPass();
        if (!data.mobileNumber || !data.guestName || !fields.guestNumber.value || !fields.tableNumber.value || !fields.seatNumber.value) {
          alert("Please enter Guest Name, Mobile Number, Guest Number, Table Number and Seat Number.");
          return;
        }
        window.open(whatsappUrl(data), "_blank", "noopener");
      });

      openInvitation.addEventListener("click", openExperience);
      panelToggle.addEventListener("click", toggleSenderPanel);

      viewport.addEventListener("scroll", () => {
        updateCurrentSlideFromScroll();
        pauseAutoScroll();
      }, { passive: true });

      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "s" && event.shiftKey) {
          toggleSenderPanel();
        }
      });

      if (new URLSearchParams(window.location.search).get("sender") === "1") {
        openSenderPanel();
      }

      populateFieldsFromUrl();
      preloadImages();
      createAmbientEffects();
      updateSecurityPass();
    })();
  </script>
</body>
</html>
